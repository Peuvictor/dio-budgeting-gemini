services:
  database:
    image: postgres:14
    environment:
      POSTGRES_DB: transaction
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5433:5432"
    volumes:
      - transaction_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d transaction"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  transaction_data: